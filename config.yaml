# WanGP Model Downloader Configuration

# Path to Wan2GP installation (where defaults/ and ckpts/ are located)
wan2gp_directory: ../Wan2GP-mryan

# Bandwidth limit in KB/s (90000 = ~90 MB/s)
# Set to null or 0 for unlimited
bandwidth_limit_kb: 30000

# HubRoot integration - query hub database to find existing models
# If a model exists in the hub, create a symlink instead of downloading
# Models stored at: {hub_models_dir}/{blake3_hash}/{filename}
hub_db: /mnt/llm/hub/hubmodels/hubrootv3.db
hub_models_dir: /mnt/llm/hub/hubmodels/models

bandwidth_pct: 85
